[workspace]
members = [".", "crates/tui-2d-prototype"]
default-members = ["."]
exclude = ["crates/tall-cell-fluid"]
resolver = "3"

[package]
name = "water-simulation"
version = "0.1.0"
edition = "2024"
default-run = "ocean"

[features]
default = ["ocean"]
ocean = ["dep:wgpu", "dep:winit", "dep:glam", "dep:bytemuck", "dep:pollster", "dep:png", "dep:image", "dep:egui", "dep:egui_extras", "dep:egui_dock", "dep:egui-winit", "dep:egui-wgpu", "dep:serde", "dep:serde_json", "dep:ron", "dep:gltf", "dep:sha2"]

[dependencies.wgpu]
version = "27.0.1"
optional = true

[dependencies.winit]
version = "0.30.13"
optional = true

[dependencies.glam]
version = "0.30"
optional = true

[dependencies.bytemuck]
version = "1.23"
features = ["derive"]
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg"]
optional = true

[dependencies.png]
version = "0.18"
optional = true

[[bin]]
name = "ocean"
path = "src/bin/ocean.rs"
required-features = ["ocean"]

[dependencies.gltf]
version = "1.4"
default-features = false
features = ["utils", "KHR_materials_unlit"]
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[[bin]]
name = "terrain-bake"
path = "src/bin/terrain_bake.rs"
required-features = ["ocean"]

[[bin]]
name = "foam-bake"
path = "src/bin/foam_bake.rs"
required-features = ["ocean"]

[[bin]]
name = "foam-lab"
path = "src/bin/foam_lab.rs"
required-features = ["ocean"]

[[bin]]
name = "ocean-profile"
path = "src/bin/ocean_profile.rs"
required-features = ["ocean"]

[[bin]]
name = "foam-weight-lab"
path = "src/bin/foam_weight_lab.rs"
required-features = ["ocean"]

[dependencies.egui]
version = "0.33.3"
features = ["serde"]
optional = true

[dependencies.egui_extras]
version = "0.33.3"
default-features = false
features = ["svg"]
optional = true

[dependencies.egui-winit]
version = "0.33.3"
optional = true

[dependencies.egui-wgpu]
version = "0.33.3"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.egui_dock]
version = "0.18.0"
features = ["serde"]
optional = true

[dependencies.ron]
version = "0.8"
optional = true
