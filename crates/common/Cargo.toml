[package]
name = "common"
version = "0.1.0"
edition = "2024"
publish = false

[features]
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
wgpu = "29.0.1"
winit = "0.30.13"
glam = "0.30"
bytemuck = { version = "1.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = { version = "0.34.3", features = ["serde"] }
egui-winit = "0.34.3"
egui-wgpu = "0.34.3"
egui_dock = { version = "0.19.1", features = ["serde"] }
yummy_egui = { version = "0.1.2", features = ["dock"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
